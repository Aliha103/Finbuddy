<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FinBuddy: split bills exactly, in any currency</title>
    <meta
      name="description"
      content="FinBuddy splits shared costs exactly, keeps every balance in its own currency and shows your own spending in the same ledger. Pre-launch, local-first and open source. Try the real split engine on this page."
    />
    <meta name="theme-color" content="#F5F3F6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121016" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="FinBuddy: split bills exactly, in any currency" />
    <meta
      property="og:description"
      content="Shared costs and your own spending in one exact ledger, in every currency you use. Pre-launch for iPhone and Android."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FinBuddy" />
    <link rel="icon" href="/brand/mark.svg" type="image/svg+xml" />
    <link rel="preload" href="/node_modules/@fontsource-variable/mona-sans/files/mona-sans-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Before first paint: a remembered appearance (the system setting is the default), and
      // the hero's short entrance hold when motion is welcome (styles.css, .intro).
      try {
        if (matchMedia('(prefers-reduced-motion: no-preference)').matches) {
          var root = document.documentElement;
          root.classList.add('intro');
          // Never hold the hero past 700 ms from navigation, however slowly the scripts arrive.
          setTimeout(function () { root.classList.remove('intro'); }, Math.max(0, 700 - performance.now()));
        }
      } catch (e) {}
      try {
        var t = localStorage.getItem('finbuddy.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
