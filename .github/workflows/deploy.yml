name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

# Production deploys share the "pages" group and never cancel each other.
# Pull request builds get their own group per PR, so they never queue behind
# or cancel a production deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: apps/web/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Clean dist directory
      run: rm -rf dist

    - name: Build project
      run: npm run build
      env:
        BASE_PATH: /Finbuddy/
        SITE_URL: https://aliha103.github.io/Finbuddy
        # The page links to the web app on the Netlify site. No VITE_ANDROID_URL: the /android
        # download exists only on Netlify.
        VITE_APP_URL: https://finbuddych.netlify.app/
        # The Netlify site's /web/ is the website's main copy; this one names it as canonical so
        # search engines do not index the two as duplicates.
        CANONICAL_URL: https://finbuddych.netlify.app/web/

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
