# The finbuddych Netlify site serves the FinBuddy app's web export (apps/mobile).
# The base is set here so the publish path never depends on the site's UI settings.
# npm finds the workspace root above apps/mobile, so the workspaces install,
# including packages/shared, which the app imports as source.
#
# The marketing website in apps/web has its own netlify.toml; connect it to a separate
# Netlify site with apps/web as the base directory.
[build]
  base = "apps/mobile"
  command = "npm run build:web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The export is a single-page app: every path serves index.html so refreshes and
# deep links reach the router.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
